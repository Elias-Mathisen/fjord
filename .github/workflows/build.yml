# Builds FjordSetup.exe on GitHub's own Windows machines, so every release can be traced to the code in this
# repository, then has SignPath sign it once the SignPath secret is set. tools\release.ps1 starts this and publishes
# the result; nothing here publishes anything.
name: Build installer
on: workflow_dispatch

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\build-installer.ps1

      # Fjord's files for tools/install.sh on Macs and Linux, straight from this commit
      - name: Pack Mac and Linux files
        run: git archive --format=tar.gz -o dist/fjord-files.tar.gz HEAD src/Fjord.cfg src/autoconfig.js src/policies.json src/icon.png src/fjord tools/install.sh LICENSE

      - name: Upload Mac and Linux files
        uses: actions/upload-artifact@v7
        with:
          name: fjord-files
          path: dist/fjord-files.tar.gz

      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: FjordSetup-unsigned
          path: dist/FjordSetup.exe

      # Set up by SignPath Foundation; until then this is skipped and releases use the unsigned installer.
      # The request waits on SignPath until you approve it there.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'fjord' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Upload signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: FjordSetup-signed
          path: signed/FjordSetup.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The whole app, with Firefox from Mozilla (signature checked) and the new-tab photos, signed ad hoc
      - name: Build Fjord.app
        run: FJORD_SRC="$PWD" sh tools/install.sh --build "$RUNNER_TEMP/dmg/Fjord.app"

      - name: Check it starts
        run: |
          app="$RUNNER_TEMP/dmg/Fjord.app"
          perl -e 'alarm 180; exec @ARGV' "$app/Contents/MacOS/fjord" --headless --window-size=1440,900             --screenshot "$RUNNER_TEMP/mac.png" "file://$app/Contents/Resources/fjord/newtab.html"
          test -s "$RUNNER_TEMP/mac.png"

      - name: Make Fjord.dmg
        run: |
          # The check's Fjord can linger and keep files busy; hdiutil on GitHub's Macs also fails now and then
          pkill -f "^$RUNNER_TEMP/dmg/Fjord.app/" || true
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          mkdir -p dist
          for i in 1 2 3; do
            # LZMA: smallest, opens on macOS 10.15 and later
            hdiutil create -volname Fjord -srcfolder "$RUNNER_TEMP/dmg" -ov -format ULMO dist/Fjord.dmg && break
            [ $i = 3 ] && exit 1
            sleep 15
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Fjord-mac
          path: dist/Fjord.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: check-mac
          path: ${{ runner.temp }}/mac.png

  # Once on GitHub's Intel and once on its ARM machines; each AppImage installs the Firefox for its own kind of computer
  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # Fjord's files and install.sh inside one file; opening it installs Fjord (tools/appimage/AppRun)
      - name: Build Fjord-${{ matrix.arch }}.AppImage
        run: |
          d="$RUNNER_TEMP/Fjord.AppDir"
          mkdir -p "$d/src" "$d/tools" dist
          cp -R src/Fjord.cfg src/autoconfig.js src/policies.json src/icon.png src/fjord "$d/src/"
          cp tools/install.sh "$d/tools/"
          cp LICENSE "$d/"
          cp tools/appimage/AppRun "$d/AppRun"
          chmod +x "$d/AppRun"
          cp src/icon.png "$d/fjord.png"
          cp tools/appimage/fjord.desktop "$d/"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH=${{ matrix.arch }} "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run "$d" dist/Fjord-${{ matrix.arch }}.AppImage

      # Opened the way a person would (installs Fjord, then starts it), with a picture of the new tab
      - name: Check it installs and starts
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 MOZ_HEADLESS=1 timeout 900 dist/Fjord-${{ matrix.arch }}.AppImage --window-size=1440,900             --screenshot "$RUNNER_TEMP/linux-${{ matrix.arch }}.png" "file://$HOME/.local/share/fjord/core/fjord/newtab.html"
          test -s "$RUNNER_TEMP/linux-${{ matrix.arch }}.png"

      - uses: actions/upload-artifact@v7
        with:
          name: Fjord-linux-${{ matrix.arch }}
          path: dist/Fjord-${{ matrix.arch }}.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: check-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-${{ matrix.arch }}.png
