<!doctype html>
<!-- A sidebar app: the site in its own browser, under a small header. Opened by Firefox's sidebar as
     chrome://fjord/content/webpanel.html?app=<id> (registered in browser.js; the app list is apps.sys.mjs). -->
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  @font-face { font-family: "Geist"; src: url("chrome://fjord/content/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #2b2b2e; --text: #ededed; --muted: #a1a1a6; --hover: rgb(255 255 255 / 0.08); --line: #3d3d40; }
  @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --hover: rgb(0 0 0 / 0.06); --line: #d8d8d8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px "Geist", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
  header img.app { width: 18px; height: 18px; border-radius: 4px; }
  header b { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: none; border-radius: 7px; background: transparent; color: inherit; cursor: pointer; }
  header button:hover { background: var(--hover); }
  header button:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  header button img { width: 16px; height: 16px; -moz-context-properties: fill; fill: currentColor; }
  #box { flex: 1; display: flex; min-height: 0; }
  #box browser { flex: 1; width: 100%; height: 100%; }
  p { margin: 24px 16px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<header>
  <img class="app" id="icon" alt="">
  <b id="name"></b>
  <button id="back" title="Back" aria-label="Back"><img src="chrome://browser/skin/back.svg" alt=""></button>
  <button id="reload" title="Reload" aria-label="Reload"><img src="chrome://global/skin/icons/reload.svg" alt=""></button>
  <button id="open" title="Open in a tab" aria-label="Open in a tab"><img src="chrome://global/skin/icons/open-in-new.svg" alt=""></button>
  <button id="close" title="Close sidebar" aria-label="Close sidebar"><img src="chrome://global/skin/icons/close.svg" alt=""></button>
</header>
<div id="box"></div>
<script src="webpanel.js"></script>
</body>
</html>
