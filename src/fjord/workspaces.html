<!doctype html>
<!-- The Workspaces panel in the sidebar: click one to switch; the logic is in features/workspaces.js -->
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  @font-face { font-family: "Geist"; src: url("chrome://fjord/content/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #2b2b2e; --text: #ededed; --muted: #a1a1a6; --hover: rgb(255 255 255 / 0.07); --sel: rgb(255 255 255 / 0.12); --line: #3d3d40; }
  @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --hover: rgb(0 0 0 / 0.05); --sel: rgb(0 0 0 / 0.08); --line: #d8d8d8; } }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px "Geist", "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 14px 6px; font-size: 15px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 4px 8px; display: grid; gap: 2px; }
  li button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px; border: none; border-radius: 9px;
    background: transparent; color: inherit; font: inherit; text-align: start; cursor: pointer; }
  li button:hover { background: var(--hover); }
  li button[aria-current="true"] { background: var(--sel); font-weight: 600; }
  li button span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); margin-top: 6px; }
  input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
  form button { padding: 8px 12px; border: none; border-radius: 8px; background: var(--text); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
</style>
</head>
<body>
<header>Workspaces</header>
<ul id="list"></ul>
<form id="add"><input id="name" placeholder="New workspace" aria-label="New workspace name"><button>Add</button></form>
<script>
  const win = window.browsingContext.topChromeWindow;
  const ws = win.Fjord.workspaces;
  function render() {
    const cur = ws.currentWs().id;
    document.getElementById("list").replaceChildren(...ws.list().map(w => {
      const li = document.createElement("li"), b = document.createElement("button"), n = document.createElement("span");
      b.textContent = w.name;
      n.textContent = String(ws.count(w.id));
      b.append(n);
      b.setAttribute("aria-current", String(w.id === cur));
      b.addEventListener("click", () => ws.switchTo(w.id));
      li.append(b);
      return li;
    }));
  }
  document.getElementById("add").addEventListener("submit", e => {
    e.preventDefault();
    ws.add(document.getElementById("name").value);
    document.getElementById("name").value = "";
  });
  win.addEventListener("FjordWorkspacesChanged", render);
  window.addEventListener("unload", () => win.removeEventListener("FjordWorkspacesChanged", render));
  render();
</script>
</body>
</html>
