<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Fjord's mark: the logo's fjord, drawn. Swapped in (chrome.manifest) for every Firefox illustration of its fox -->
  <defs>
    <clipPath id="tile"><rect width="96" height="96" rx="21"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4e4ef"/><stop offset="1" stop-color="#e6eff6"/></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="96" height="96" fill="url(#sky)"/>
    <polygon points="0.0,50.6 24.0,28.1 44.1,46.9 64.7,22.1 96.0,47.8 96.0,96.0 0.0,96.0" fill="#93b9d2"/>
    <polygon points="0.0,65.6 31.5,40.3 56.2,61.9 78.8,44.2 96.0,56.2 96.0,96.0 0.0,96.0" fill="#3a72a0"/>
    <polygon points="0.0,77.8 36.8,56.2 96.0,75.9 96.0,96.0 0.0,96.0" fill="#12324f"/>
  </g>
</svg>
