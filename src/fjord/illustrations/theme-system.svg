    <g clip-path="url(#page)">
      <rect x="8" y="44" width="184" height="72" fill="url(#day)"/>
      <circle cx="156" cy="62" r="8" fill="#ffffff"/>
      <path d="M8 104l50-17 20 9 30-21 36 24 26-12 22 10v19H8z" fill="#8f99a5"/>
      <path d="M8 110l56-10 26 6 38-12 30 9 34-6v19H8z" fill="#b6bec7"/>
    </g>
  </g>
  <g clip-path="url(#left)">
    <rect width="200" height="124" rx="12" fill="#1e1e20"/>
    <circle cx="14" cy="13" r="3" fill="#4a4a4e"/><circle cx="24" cy="13" r="3" fill="#4a4a4e"/><circle cx="34" cy="13" r="3" fill="#4a4a4e"/>
    <rect x="48" y="6" width="54" height="14" rx="5" fill="#38383b"/>
