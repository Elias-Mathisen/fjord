    <clipPath id="page"><rect x="8" y="44" width="184" height="72" rx="7"/></clipPath>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#2a2c33"/></linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfd0e2"/><stop offset="1" stop-color="#eef2f6"/></linearGradient>
  </defs>
  <g clip-path="url(#right)">
    <rect width="200" height="124" rx="12" fill="#f0f0f0"/>
    <rect x="48" y="6" width="54" height="14" rx="5" fill="#ffffff"/>
    <rect x="108" y="10" width="34" height="6" rx="3" fill="#e2e2e4"/>
