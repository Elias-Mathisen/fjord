// Fjord config (Firefox skips this first line).
// defaultPref = Fjord's default; users can still change it in Settings.

// Privacy
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.globalprivacycontrol.enabled", true);
defaultPref("cookiebanners.service.mode", 1);
defaultPref("cookiebanners.service.mode.privateBrowsing", 1);
defaultPref("privacy.query_stripping.enabled", true);          // strip tracking parameters (fbclid, gclid...) from links
defaultPref("privacy.query_stripping.enabled.pbmode", true);
defaultPref("privacy.bounceTrackingProtection.mode", 1);        // wipe data of sites that only exist to bounce you around
defaultPref("network.http.referer.XOriginTrimmingPolicy", 2);   // other sites see only which site you came from, never the page
defaultPref("media.peerconnection.ice.default_address_only", true); // WebRTC: don't leak local IP
defaultPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);
defaultPref("browser.safebrowsing.downloads.remote.enabled", false); // local malware lists still apply; downloads aren't sent to Google
defaultPref("browser.uitour.enabled", false);
defaultPref("browser.discovery.enabled", false);
defaultPref("network.prefetch-next", false);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.predictor.enabled", false);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);
defaultPref("browser.places.speculativeConnect.enabled", false);
defaultPref("privacy.userContext.enabled", true);               // container tabs (work / personal / shopping)
defaultPref("privacy.userContext.ui.enabled", true);
defaultPref("dom.security.https_only_mode", true);              // sites without HTTPS get a warning page first
defaultPref("browser.ai.control.default", "blocked");          // Mozilla's AI chatbot, link previews and smart tab groups
defaultPref("browser.ai.control.translations", "enabled");     // page translation runs on the computer, so it stays
defaultPref("browser.ml.chat.enabled", false);
defaultPref("browser.ml.linkPreview.enabled", false);
defaultPref("browser.search.separatePrivateDefault", true);          // private windows get their own search engine
defaultPref("browser.search.separatePrivateDefault.ui.enabled", true);
// Firefox puts a "<name> Private Browsing" shortcut with its own icon in the Windows Start menu on first start, which
// Fjord's uninstaller didn't make and so left behind; Fjord's private windows are in its menus and Ctrl+Shift+P
defaultPref("browser.privacySegmentation.createdShortcut", true);
defaultPref("fjord.lookalike.enabled", true);
defaultPref("fjord.permissionWatch.notice", true);
defaultPref("fjord.debounce.enabled", true);
defaultPref("fjord.clipboardGuard.enabled", true);
defaultPref("fjord.fingerprint.randomise", true);
defaultPref("fjord.commandBar.enabled", true);
defaultPref("fjord.glance.enabled", true);
defaultPref("fjord.newtab.blocked", true);
defaultPref("fjord.newtab.time", true);
defaultPref("fjord.newtab.data", true);
defaultPref("fjord.newtab.week", true);
defaultPref("fjord.newtab.clock", true);
defaultPref("fjord.newtab.photos", true);

// No background check-ins (found by logging every connection a fresh Fjord makes).
// Kept on purpose: security lists (remote settings, Safe Browsing), add-on and filter-list updates, web push
// (site notifications), and the Widevine/OpenH264 codecs that Spotify, Netflix and video calls need.
defaultPref("network.captive-portal-service.enabled", false);   // hotel/airport Wi-Fi login pages no longer pop up on their own
defaultPref("network.connectivity-service.enabled", false);
defaultPref("browser.region.update.enabled", false);            // Mozilla's "which country are you in" lookup
defaultPref("browser.region.network.url", "");
defaultPref("app.normandy.enabled", false);                      // remote experiments
defaultPref("app.normandy.api_url", "");
defaultPref("extensions.systemAddon.update.enabled", false);    // silent Mozilla add-on updates; Fjord's updater brings them
defaultPref("extensions.systemAddon.update.url", "");
defaultPref("extensions.getAddons.cache.enabled", false);        // add-on descriptions fetched in the background
defaultPref("geo.provider.network.url", "https://api.beacondb.net/v1/geolocate"); // when you allow a site your location: community-run, not Google
defaultPref("breakpad.reportURL", "");                           // crash reports
defaultPref("browser.tabs.crashReporting.sendReport", false);
defaultPref("browser.crashReports.unsubmittedCheck.autoSubmit2", false);

// Security
defaultPref("network.IDN_show_punycode", true);                 // lookalike domains show as xn--..., not as the real brand
defaultPref("security.tls.enable_0rtt_data", false);            // no replayable early data
defaultPref("security.ssl.treat_unsafe_negotiation_as_broken", true);
defaultPref("security.cert_pinning.enforcement_level", 2);
defaultPref("security.pki.crlite_mode", 2);                     // check certificate revocation locally (CRLite)
defaultPref("security.mixed_content.block_display_content", true);
defaultPref("browser.xul.error_pages.expert_bad_cert", true);
defaultPref("network.auth.subresource-http-auth-allow", 1);    // no password popups from embedded content (phishing)
defaultPref("pdfjs.enableScripting", false);                    // PDFs can't run JavaScript
defaultPref("signon.autofillForms", false);                     // passwords fill only when you pick them
defaultPref("signon.formlessCapture.enabled", false);
defaultPref("browser.download.always_ask_before_handling_new_types", true);

// Look (light/dark is set by the setup: ui.systemUsesDarkTheme)
defaultPref("browser.tabs.firefox-view", false);
defaultPref("browser.toolbars.bookmarks.visibility", "never");
defaultPref("browser.aboutConfig.showWarning", false);
// No Firefox placeholder window while starting (it pulses, and has Firefox's icon until Fjord's window replaces it).
// The installer switches it off in the registry too, so the first start after installing skips it as well
defaultPref("browser.startup.preXulSkeletonUI", false);
// No Windows "pin Firefox to your taskbar?" or "make it your default browser?" prompts on a new profile's first start
defaultPref("browser.bypassAutoTriggerActions", true);

// Fjord's own files live in <install>/fjord/
try {
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("fjord");
  const file = name => {
    const f = dir.clone();
    f.append(name);
    return f;
  };
  const fileURI = name => Services.io.newFileURI(file(name));

  // loadSubScript only trusts chrome:/resource: URLs, so expose the folder as resource://fjord/
  Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("fjord", Services.io.newFileURI(dir));

  // Up to 1.0.0 Fjord saved its settings and files under its old name, Nocturne: moved over once, before any
  // window reads them (user settings aren't loaded yet while this file runs)
  Services.obs.addObserver(function migrate() {
    Services.obs.removeObserver(migrate, "final-ui-startup");
    const p = Services.prefs;
    for (const name of p.getChildList("nocturne.")) {
      const to = "fjord." + name.slice("nocturne.".length);
      if (p.prefHasUserValue(name) && !p.prefHasUserValue(to)) {
        const type = p.getPrefType(name);
        if (type === p.PREF_BOOL) p.setBoolPref(to, p.getBoolPref(name));
        else if (type === p.PREF_INT) p.setIntPref(to, p.getIntPref(name));
        else p.setStringPref(to, p.getStringPref(name));
      }
      p.clearUserPref(name);
    }
    const profile = Services.dirsvc.get("ProfD", Ci.nsIFile);
    for (const name of ["app-icons.json", "permissions.json", "week.json", "stats.js"]) {
      const old = profile.clone(), fresh = profile.clone();
      old.append("nocturne-" + name);
      fresh.append("fjord-" + name);
      try {
        if (!old.exists()) continue;
        if (fresh.exists() || name === "stats.js") old.remove(false); // the stats file is rewritten every 30 s anyway
        else old.moveTo(null, fresh.leafName);
      } catch (e) {
        Services.console.logStringMessage("Fjord couldn't move " + old.path + ": " + e);
      }
    }
  }, "final-ui-startup");

  // The Mac app from Fjord.dmg sets up its own updater (install.sh --register) the first time it runs from
  // Applications; installs made by install.sh already have one
  if (Services.appinfo.OS === "Darwin") {
    Services.obs.addObserver(function updater() {
      Services.obs.removeObserver(updater, "final-ui-startup");
      const app = Services.dirsvc.get("GreD", Ci.nsIFile).parent.parent; // Fjord.app/Contents/Resources
      const home = Services.dirsvc.get("Home", Ci.nsIFile).path;
      const local = path => {
        const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        f.initWithPath(path);
        return f;
      };
      if (local(home + "/Library/LaunchAgents/io.github.eliasmathisen.fjord.update.plist").exists()) return;
      if (!["/Applications/Fjord.app", home + "/Applications/Fjord.app"].includes(app.path)) return; // e.g. opened from the dmg
      const sh = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
      sh.init(local("/bin/sh"));
      sh.runAsync([file("install.sh").path, "--register"], 2);
    }, "final-ui-startup");
  }

  // Unlock saved passwords before any window can ask for them (keylock.sys.mjs)
  if (Services.appinfo.OS === "WINNT") {
    Services.obs.addObserver(() => ChromeUtils.importESModule("resource://fjord/keylock.sys.mjs"), "final-ui-startup");
  }

  // Fjord's name and logo instead of Firefox's: images and old-style strings via chrome.manifest,
  // the "-brand-*" names used by menus, titles and settings via a Fluent source checked before Firefox's
  try {
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(file("chrome.manifest"));
    // This sandbox lacks the Fluent classes; Firefox's shared module global has them
    const { L10nRegistry, L10nFileSource } = Cu.getGlobalForObject(
      ChromeUtils.importESModule("resource://gre/modules/AppConstants.sys.mjs"));
    const l10n = L10nRegistry.getInstance();
    l10n.registerSources([new L10nFileSource("1-fjord", "app", l10n.getAvailableLocales(),
      "resource://fjord/l10n/", {}, ["resource://fjord/l10n/branding/brand.ftl"])]);
  } catch (e) {
    Services.console.logStringMessage("Fjord branding failed: " + e);
  }

  // Shared by every window (setup must only open once)
  const shared = { newtab: fileURI("newtab.html").spec, setupOpen: false };
  defaultPref("browser.startup.homepage", shared.newtab);

  Services.obs.addObserver(win => {
    win.addEventListener("load", () => {
      if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
      win.FJORD = shared;
      Services.scriptloader.loadSubScript("resource://fjord/browser.js", win);
    }, { once: true });
  }, "domwindowopened");
} catch (e) {
  Services.console.logStringMessage("Fjord failed to load: " + e);
}
