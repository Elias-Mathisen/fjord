<!-- Fjord logo: three ridges over a fjord at dawn. tools\make-icon.ps1 draws the same shapes into the icon PNGs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4e5f0"/><stop offset="1" stop-color="#f2f7fa"/></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <path d="M0 268 128 150 236 250 344 118 512 262V512H0z" fill="#93b9d2"/>
    <path d="M0 350 168 214 300 330 420 236 512 300V512H0z" fill="#3a72a0"/>
    <path d="M0 420 196 300 512 408V512H0z" fill="#12324f"/>
  </g>
</svg>
